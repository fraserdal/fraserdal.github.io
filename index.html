<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Strike — 3D Shooter</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block;width:100vw;height:100vh;background:#0b0f18;cursor:crosshair}
  #hud{position:fixed;inset:0;pointer-events:none}
  #stats{position:absolute;top:16px;left:16px;display:flex;gap:8px;flex-wrap:wrap}
  .box{background:rgba(5,8,15,.8);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:8px 12px;font-size:14px}
  #help{position:absolute;top:16px;right:16px;text-align:right;color:#c6d0e1;font-size:12px;line-height:1.5}
  #cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
  #cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 6px #fff}
  #cross:before{width:2px;height:22px;left:10px}
  #cross:after{height:2px;width:22px;top:10px}
  #bottom{position:absolute;left:16px;bottom:16px;width:240px}
  #healthLabel{font-size:12px;margin-bottom:6px}
  #healthBar{height:14px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
  #healthFill{height:100%;width:100%;background:#4cff8b}
  #ammo{position:absolute;right:16px;bottom:16px;background:rgba(5,8,15,.82);border:1px solid rgba(255,255,255,.15);padding:10px 14px;border-radius:10px;font-size:21px;font-weight:700}
  #message{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:20px;font-weight:800;text-shadow:0 2px 12px #000;opacity:0}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(27,45,80,.38),rgba(0,0,0,.88));z-index:5}
  .panel{width:min(560px,calc(100vw - 30px));padding:30px;text-align:center;border-radius:18px;background:rgba(7,11,20,.94);border:1px solid rgba(255,255,255,.15);box-shadow:0 25px 80px rgba(0,0,0,.55)}
  h1{font-size:clamp(36px,8vw,62px);margin:0 0 8px;letter-spacing:2px}
  p{color:#cbd4e5;line-height:1.55}
  button{margin-top:12px;border:0;border-radius:11px;padding:13px 23px;font-size:16px;font-weight:800;background:#69ff9b;color:#07120b;cursor:pointer}
  #damage{position:fixed;inset:0;background:rgba(255,40,60,.38);opacity:0;pointer-events:none;z-index:4}
  @media(max-width:700px){#help{display:none}#bottom{width:180px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="stats">
    <div class="box">SCORE: <b id="score">0</b></div>
    <div class="box">WAVE: <b id="wave">1</b></div>
    <div class="box">ENEMIES: <b id="enemyCount">0</b></div>
  </div>
  <div id="help">WASD move · Mouse aim · Click shoot · R reload · Shift sprint</div>
  <div id="cross"></div>
  <div id="message"></div>
  <div id="bottom">
    <div id="healthLabel">HEALTH <b id="healthText">100</b></div>
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div id="ammo">12 / 12</div>
</div>

<div id="damage"></div>

<div id="overlay">
  <div class="panel" id="panel">
    <h1>NEON STRIKE</h1>
    <p>A standalone browser FPS. No downloads or external libraries are needed.</p>
    <p><b>WASD</b> move · <b>Mouse</b> aim · <b>Left click</b> shoot · <b>Shift</b> sprint · <b>R</b> reload</p>
    <button id="start">ENTER ARENA</button>
  </div>
</div>

<script>
(() => {
'use strict';

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=document.getElementById('score');
const waveEl=document.getElementById('wave');
const enemyCountEl=document.getElementById('enemyCount');
const healthText=document.getElementById('healthText');
const healthFill=document.getElementById('healthFill');
const ammoEl=document.getElementById('ammo');
const messageEl=document.getElementById('message');
const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');
const damage=document.getElementById('damage');

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const FOV=Math.PI/2.9;
const MAP=28;
const keys=new Set();
let mouseDown=false,locked=false,last=performance.now();
let msgTime=0,shootFlash=0;

const player={
  x:0,y:0,a:0,
  health:100,
  score:0,
  wave:1,
  ammo:12,maxAmmo:12,
  reload:0,
  cooldown:0,
  alive:false,
  bob:0
};

const walls=[
  {x:-12,y:-10,w:5,h:3},
  {x:11,y:-8,w:6,h:4},
  {x:-10,y:10,w:4,h:5},
  {x:10,y:11,w:5,h:3},
  {x:0,y:-2,w:3,h:2},
  {x:0,y:18,w:7,h:3},
  {x:-19,y:2,w:3,h:7},
  {x:19,y:-2,w:3,h:7}
];

const enemies=[];
let spawnQueue=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function normAng(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function blocked(x,y,r=.42){
  if(x<-MAP+r||x>MAP-r||y<-MAP+r||y>MAP-r)return true;
  for(const w of walls){
    if(x>w.x-w.w/2-r&&x<w.x+w.w/2+r&&y>w.y-w.h/2-r&&y<w.y+w.h/2+r)return true;
  }
  return false;
}
function moveWithCollisions(nx,ny){
  if(!blocked(nx,player.y))player.x=nx;
  if(!blocked(player.x,ny))player.y=ny;
}

function randomSpawn(){
  for(let i=0;i<100;i++){
    const x=-24+Math.random()*48,y=-24+Math.random()*48;
    if(dist(x,y,player.x,player.y)>11&&!blocked(x,y,.5))return{x,y};
  }
  return{x:22,y:22};
}

function newEnemy(){
  const p=randomSpawn();
  enemies.push({
    x:p.x,y:p.y,
    hp:100,
    speed:1.25+Math.random()*.85+player.wave*.06,
    attack:.4+Math.random(),
    phase:Math.random()*Math.PI*2,
    hit:0
  });
}

function startWave(){
  spawnQueue=Math.min(3+player.wave*2,22);
  showMessage('WAVE '+player.wave,1.2);
}

function updateHUD(){
  scoreEl.textContent=player.score;
  waveEl.textContent=player.wave;
  enemyCountEl.textContent=enemies.length+spawnQueue;
  healthText.textContent=Math.max(0,Math.ceil(player.health));
  healthFill.style.width=clamp(player.health,0,100)+'%';
  ammoEl.textContent=player.reload>0?'RELOADING...':player.ammo+' / '+player.maxAmmo;
}

function showMessage(t,time=.9){
  messageEl.textContent=t;messageEl.style.opacity=1;msgTime=time;
}

function takeDamage(n){
  player.health-=n;
  damage.style.opacity=.85;
  setTimeout(()=>damage.style.opacity=0,70);
  if(player.health<=0)gameOver();
}

function reload(){
  if(!player.alive||player.reload>0||player.ammo===player.maxAmmo)return;
  player.reload=.75;showMessage('RELOADING',.75);
}

function castRay(angle,maxDist=60){
  const sin=Math.sin(angle),cos=Math.cos(angle);
  let t=0,step=.035;
  while(t<maxDist){
    t+=step;
    const x=player.x+sin*t,y=player.y+cos*t;
    if(blocked(x,y,.05))return{x,y,t};
  }
  return{x:player.x+sin*maxDist,y:player.y+cos*maxDist,t:maxDist};
}

function shoot(){
  if(!player.alive||!locked||player.reload>0||player.cooldown>0)return;
  if(player.ammo<=0){reload();return;}
  player.ammo--;
  player.cooldown=.18;
  shootFlash=.045;

  let best=null,bestDist=999;
  for(const e of enemies){
    const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
    if(d>55)continue;
    const ang=normAng(Math.atan2(dx,dy)-player.a);
    const angularSize=Math.min(.15,.55/d);
    if(Math.abs(ang)<angularSize){
      const wallHit=castRay(player.a,d);
      if(wallHit.t+0.05>=d && d<bestDist){best=e;bestDist=d;}
    }
  }

  if(best){
    best.hp-=50;best.hit=.09;
    player.score+=best.hp<=0?100:15;
    if(best.hp<=0){
      const i=enemies.indexOf(best);if(i>=0)enemies.splice(i,1);
      if(enemies.length===0&&spawnQueue===0&&player.alive){
        player.wave++;startWave();
      }
    }
  }
  updateHUD();
}

function gameOver(){
  player.alive=false;locked=false;
  panel.innerHTML='<h1>GAME OVER</h1>'+
    '<p>Final score: <b>'+player.score+'</b></p>'+
    '<p>You reached wave <b>'+player.wave+'</b>.</p>'+
    '<button id="restart">PLAY AGAIN</button>';
  overlay.style.display='flex';
  document.getElementById('restart').onclick=reset;
}

function reset(){
  player.x=0;player.y=0;player.a=0;
  player.health=100;player.score=0;player.wave=1;
  player.ammo=12;player.reload=0;player.cooldown=0;player.alive=true;
  enemies.length=0;spawnQueue=0;overlay.style.display='none';
  startWave();updateHUD();
  canvas.requestPointerLock?.();
}

document.getElementById('start').onclick=reset;

canvas.addEventListener('click',()=>{
  if(!locked&&player.alive){canvas.requestPointerLock?.();return;}
  shoot();
});
canvas.addEventListener('mousedown',e=>{if(e.button===0)mouseDown=true});
addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas});
document.addEventListener('mousemove',e=>{
  if(!locked||!player.alive)return;
  player.a+=e.movementX*.0024;
});
addEventListener('keydown',e=>{
  keys.add(e.code);
  if(e.code==='KeyR')reload();
});
addEventListener('keyup',e=>keys.delete(e.code));

function update(dt,now){
  if(!player.alive)return;
  if(player.cooldown>0)player.cooldown-=dt;
  if(player.reload>0){
    player.reload-=dt;
    if(player.reload<=0){player.reload=0;player.ammo=player.maxAmmo;showMessage('READY',.5)}
  }
  if(msgTime>0){msgTime-=dt;if(msgTime<=0)messageEl.style.opacity=0}

  if(spawnQueue>0){
    if(!update.spawnTimer)update.spawnTimer=.1;
    update.spawnTimer-=dt;
    if(update.spawnTimer<=0){
      newEnemy();spawnQueue--;update.spawnTimer=.16;updateHUD();
    }
  }

  let mx=0,my=0;
  if(keys.has('KeyW'))my+=1;
  if(keys.has('KeyS'))my-=1;
  if(keys.has('KeyD'))mx+=1;
  if(keys.has('KeyA'))mx-=1;
  const len=Math.hypot(mx,my)||1;mx/=len;my/=len;
  const sprint=keys.has('ShiftLeft')||keys.has('ShiftRight');
  const speed=sprint?7.5:4.8;
  const sin=Math.sin(player.a),cos=Math.cos(player.a);
  const dx=(sin*my+cos*mx)*speed*dt;
  const dy=(cos*my-sin*mx)*speed*dt;
  moveWithCollisions(player.x+dx,player.y+dy);

  if(mx||my)player.bob+=dt*10;else player.bob*=.9;
  if(mouseDown)shoot();

  for(const e of enemies.slice()){
    e.attack-=dt;if(e.hit>0)e.hit-=dt;
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
    if(d>1.8){
      const ux=dx/d,uy=dy/d;
      const side=-Math.sin(now*.0015+e.phase)*.18;
      const nx=e.x+(ux+side*(-uy))*e.speed*dt;
      const ny=e.y+(uy+side*ux)*e.speed*dt;
      if(!blocked(nx,ny,.36)){e.x=nx;e.y=ny}
      else if(!blocked(e.x+ux*e.speed*dt,e.y,.36))e.x+=ux*e.speed*dt;
      else if(!blocked(e.x,e.y+uy*e.speed*dt,.36))e.y+=uy*e.speed*dt;
    }else if(e.attack<=0){
      takeDamage(8+player.wave*.6);
      e.attack=.7+Math.random()*.6;
    }
  }
  updateHUD();
}

function wallIntersect(angle){
  return castRay(angle,60);
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H*.55);
  sky.addColorStop(0,'#04070e');sky.addColorStop(1,'#18253a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H/2);
  ctx.fillStyle='#0c111a';ctx.fillRect(0,H/2,W,H/2);
  for(let y=H/2;y<H;y+=28){
    const alpha=(y-H/2)/(H/2)*.13;
    ctx.strokeStyle='rgba(80,120,160,'+alpha+')';
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  for(let x=-W;x<2*W;x+=80){
    const xx=W/2+(x-W/2)*.08;
    ctx.strokeStyle='rgba(80,120,160,.08)';
    ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(xx,H);ctx.stroke();
  }
}

function drawScene(){
  drawBackground();

  const rayCount=Math.min(Math.floor(W/2),700);
  const colW=W/rayCount;
  const zbuf=new Array(rayCount);

  for(let i=0;i<rayCount;i++){
    const a=player.a-FOV/2+(i+.5)/rayCount*FOV;
    const hit=wallIntersect(a);
    const corrected=hit.t*Math.cos(normAng(a-player.a));
    zbuf[i]=corrected;

    const height=Math.min(H*2, H/(corrected+.001)*1.55);
    const top=H/2-height/2;
    const shade=clamp(1-corrected/55,.15,1);
    const r=Math.floor(24*shade),g=Math.floor(43*shade),b=Math.floor(67*shade);
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.fillRect(i*colW,top,colW+1,height);

    if((i%12)===0){
      ctx.fillStyle='rgba(110,170,230,'+(0.055*shade)+')';
      ctx.fillRect(i*colW,top,colW+1,height);
    }
  }

  const sprites=[];
  for(const e of enemies){
    const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
    const ang=normAng(Math.atan2(dx,dy)-player.a);
    if(Math.abs(ang)<FOV/2+.18){
      const screenX=W/2+Math.tan(ang)/(Math.tan(FOV/2))*W/2;
      const depth=d*Math.cos(ang);
      const idx=Math.floor(clamp(screenX/W*rayCount,0,rayCount-1));
      if(depth<zbuf[idx]+.15)sprites.push({e,d,screenX,depth});
    }
  }
  sprites.sort((a,b)=>b.depth-a.depth);

  for(const s of sprites){
    const size=H/(s.depth+.001)*1.32;
    const x=s.screenX,y=H/2+size*.13;
    const e=s.e;
    ctx.save();
    ctx.translate(x,y);
    const hurt=e.hit>0;
    ctx.fillStyle=hurt?'#fff':'#ff405a';
    ctx.shadowColor=hurt?'#fff':'#ff405a';ctx.shadowBlur=18;
    ctx.fillRect(-size*.16,-size*.36,size*.32,size*.55);
    ctx.fillStyle='#f2b49b';ctx.beginPath();ctx.arc(0,-size*.47,size*.13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#77fff0';ctx.fillRect(-size*.07,-size*.49,size*.035,size*.035);ctx.fillRect(size*.035,-size*.49,size*.035,size*.035);
    ctx.restore();

    // health bar
    const bw=size*.38,bh=Math.max(3,size*.018);
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x-bw/2,y-size*.68,bw,bh);
    ctx.fillStyle='#69ff9b';ctx.fillRect(x-bw/2,y-size*.68,bw*(e.hp/100),bh);
  }

  // Weapon
  const bob=Math.sin(player.bob)*5;
  const wx=W*.68,wy=H*.79+bob;
  ctx.save();
  ctx.translate(wx,wy);
  ctx.rotate(-.06);
  ctx.fillStyle='#121a27';ctx.fillRect(-40,0,115,44);
  ctx.fillStyle='#29364b';ctx.fillRect(-25,-10,58,25);
  ctx.fillStyle='#0a0f17';ctx.fillRect(28,-5,70,12);
  ctx.fillStyle='#101722';ctx.fillRect(-10,31,25,62);
  ctx.restore();

  if(shootFlash>0){
    ctx.fillStyle='rgba(255,230,130,.8)';
    ctx.beginPath();ctx.arc(wx+98,wy,10+Math.random()*5,0,Math.PI*2);ctx.fill();
    shootFlash-=.016;
  }
}

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt,now);
  drawScene();
  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
